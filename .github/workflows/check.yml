name: metadata-and-contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-core.txt
      - run: python -m glomerulus_tools.build
      - run: python -m pytest glomerulus_tools/tests -q
